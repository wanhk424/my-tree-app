<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇門遁甲排盤系統 - 自動八字版</title>
    <!-- 引入 Lunar JavaScript 曆法庫處理西曆轉農曆及八字 -->
    <script src="https://unpkg.com/lunar-javascript/lunar.js"></script>
    <style>
        body { font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; }
        
        /* 基本資訊 Panel */
        .panel { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 20px; border: 1px solid #e0e0e0; }
        .panel-header { background: #e3f2fd; padding: 12px 15px; color: #1565c0; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .panel-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        
        .form-row { display: flex; gap: 15px; }
        .form-left { flex: 2; display: flex; flex-direction: column; gap: 10px; }
        .form-right { flex: 1; display: flex; flex-direction: column; gap: 8px; }
        
        .input-group { display: flex; align-items: center; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; background: #fff; }
        .input-group label { background: #f9f9f9; padding: 8px 12px; border-right: 1px solid #ccc; color: #555; font-size: 14px; white-space: nowrap; }
        .input-group input { flex: 1; border: none; padding: 8px 10px; font-size: 14px; outline: none; width: 100%; box-sizing: border-box; }
        .input-group input[readonly] { background: #fdfdfd; color: #666; }
        
        .pillar-box { border: 1px solid #e0e0e0; border-radius: 4px; padding: 8px; text-align: center; background: #fafafa; font-size: 14px; color: #333; letter-spacing: 2px; }
        
        /* 局數與手動微調區 */
        .manual-settings { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 15px; display: flex; gap: 10px; align-items: center; border: 1px solid #e0e0e0; }
        .manual-settings select, .manual-settings input { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        button.calc-btn { background: #1976d2; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: auto; }
        
        /* 九宮格佈局 */
        .gong-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #e0e0e0; border: 1px solid #ddd; }
        .gong { height: 130px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px; box-sizing: border-box; }
        
        /* 顏色對應圖中風格 */
        .bg-blue { background-color: #bbdefb; } /* 4, 2, 8, 6 */
        .bg-yellow { background-color: #fff9c4; } /* 9, 3, 7, 1 */
        .bg-white { background-color: #ffffff; } /* 5 */
        
        .gong-num { position: absolute; top: 5px; right: 8px; font-size: 14px; color: #999; }
        
        /* 宮內文字排版 */
        .gong-data { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 4px 15px; text-align: center; font-size: 16px; color: #111; z-index: 2; }
        
        /* 特殊標記顏色 */
        .red-mark { color: #d32f2f; font-weight: bold; font-size: 14px; position: absolute; }
        .green-stem { color: #00897b; font-weight: bold; position: absolute; left: 8px; top: 35px; font-size: 15px; }
        
        /* 中宮特殊排版 */
        .center-text { text-align: center; font-size: 15px; line-height: 1.6; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <!-- 基本資訊 Panel -->
    <div class="panel">
        <div class="panel-header">
            <span>基本資訊</span>
            <span>^</span>
        </div>
        <div class="panel-body">
            <div class="form-row">
                <div class="form-left">
                    <div class="input-group">
                        <label>日期</label>
                        <input type="datetime-local" id="dateInput" onchange="autoConvert()">
                    </div>
                    <div class="input-group">
                        <label>農曆</label>
                        <input type="text" id="lunarText" readonly>
                    </div>
                    <div class="input-group">
                        <label id="prevJqLabel">節氣</label>
                        <input type="text" id="prevJqText" readonly>
                    </div>
                    <div class="input-group">
                        <label id="nextJqLabel">節氣</label>
                        <input type="text" id="nextJqText" readonly>
                    </div>
                </div>
                <div class="form-right">
                    <div class="pillar-box" id="yearPillar">年 --</div>
                    <div class="pillar-box" id="monthPillar">月 --</div>
                    <div class="pillar-box" id="dayPillar">日 --</div>
                    <div class="pillar-box" id="hourPillar">時 --</div>
                </div>
            </div>
            <div class="input-group">
                <label>備註</label>
                <input type="text" placeholder="備註">
            </div>
        </div>
    </div>

    <!-- 隱藏/顯示的微調區 (程式計算所依賴的值) -->
    <div class="manual-settings">
        <label>局數:</label>
        <select id="juType"><option value="陽">陽</option><option value="陰">陰</option></select>
        <input type="number" id="juNumber" value="1" min="1" max="9" style="width: 40px;">
        <label style="margin-left:10px;">時干支:</label>
        <input type="text" id="manualHourGz" style="width: 50px;" readonly>
        <button class="calc-btn" onclick="calculate()">手動排盤更新</button>
    </div>

    <!-- 九宮格 -->
    <div class="gong-grid">
        <!-- 4 巽 -->
        <div class="gong bg-blue" id="gong-4">
            <div class="gong-num">4</div>
            <div class="green-stem" id="g4-hidden"></div>
            <div class="gong-data" id="g4-data"></div>
        </div>
        <!-- 9 離 -->
        <div class="gong bg-yellow" id="gong-9">
            <div class="gong-num">9</div>
            <div class="green-stem" id="g9-hidden"></div>
            <div class="gong-data" id="g9-data"></div>
        </div>
        <!-- 2 坤 -->
        <div class="gong bg-blue" id="gong-2">
            <div class="gong-num">2</div>
            <div class="green-stem" id="g2-hidden"></div>
            <div class="gong-data" id="g2-data"></div>
        </div>
        
        <!-- 3 震 -->
        <div class="gong bg-yellow" id="gong-3">
            <div class="gong-num">3</div>
            <div class="green-stem" id="g3-hidden"></div>
            <div class="gong-data" id="g3-data"></div>
        </div>
        <!-- 5 中 -->
        <div class="gong bg-white" id="gong-5">
            <div class="center-text" id="g5-data">
                -- 局<br>-- 旬<br>-- 時
            </div>
        </div>
        <!-- 7 兌 -->
        <div class="gong bg-yellow" id="gong-7">
            <div class="gong-num">7</div>
            <div class="green-stem" id="g7-hidden"></div>
            <div class="gong-data" id="g7-data"></div>
        </div>
        
        <!-- 8 艮 -->
        <div class="gong bg-blue" id="gong-8">
            <div class="gong-num">8</div>
            <div class="green-stem" id="g8-hidden"></div>
            <div class="gong-data" id="g8-data"></div>
        </div>
        <!-- 1 坎 -->
        <div class="gong bg-yellow" id="gong-1">
            <div class="gong-num">1</div>
            <div class="green-stem" id="g1-hidden"></div>
            <div class="gong-data" id="g1-data"></div>
        </div>
        <!-- 6 乾 -->
        <div class="gong bg-blue" id="gong-6">
            <div class="gong-num">6</div>
            <div class="green-stem" id="g6-hidden"></div>
            <div class="gong-data" id="g6-data"></div>
        </div>
    </div>
</div>

<script>
    // 設定預設時間為現在
    window.onload = function() {
        let now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('dateInput').value = now.toISOString().slice(0,16);
        autoConvert();
    };

    // 自動轉換八字與節氣
    function autoConvert() {
        let dateStr = document.getElementById('dateInput').value;
        if (!dateStr) return;
        
        let date = new Date(dateStr);
        let lunar = Lunar.fromDate(date);
        
        // 取得四柱
        let yGz = lunar.getYearInGanZhi();
        let mGz = lunar.getMonthInGanZhi();
        let dGz = lunar.getDayInGanZhi();
        let hGz = lunar.getTimeInGanZhi();
        
        document.getElementById('yearPillar').innerText = '年 ' + yGz;
        document.getElementById('monthPillar').innerText = '月 ' + mGz;
        document.getElementById('dayPillar').innerText = '日 ' + dGz;
        document.getElementById('hourPillar').innerText = '時 ' + hGz;
        document.getElementById('manualHourGz').value = hGz;
        
        // 取得農曆
        document.getElementById('lunarText').value = lunar.getMonthInChinese() + '月' + lunar.getDayInChinese();
        
        // 取得節氣
        let prevJq = lunar.getPrevJieQi();
        let nextJq = lunar.getNextJieQi();
        
        document.getElementById('prevJqLabel').innerText = prevJq.getName();
        document.getElementById('prevJqText').value = prevJq.getSolar().toYmdHms();
        document.getElementById('nextJqLabel').innerText = nextJq.getName();
        document.getElementById('nextJqText').value = nextJq.getSolar().toYmdHms();

        // 簡易局數推算 (可依據各派別微調，此處採用日支時支推演)
        // 這裡暫時隨機示範，你可以套用 PDF 的總和除 9 邏輯
        const BRANCH_NUMS = { "子":1, "丑":2, "寅":3, "卯":4, "辰":5, "巳":6, "午":7, "未":8, "申":9, "酉":10, "戌":11, "亥":12 };
        let sum = BRANCH_NUMS[yGz[1]] + BRANCH_NUMS[mGz[1]] + lunar.getDay() + BRANCH_NUMS[hGz[1]];
        let juNum = sum % 9;
        if(juNum === 0) juNum = 9;
        
        // 冬至後陽，夏至後陰 (簡化判斷)
        let monthNum = lunar.getMonth();
        let isYin = (monthNum >= 5 && monthNum <= 10) ? '陰' : '陽';
        
        document.getElementById('juType').value = isYin;
        document.getElementById('juNumber').value = juNum;
        
        calculate(); // 觸發排盤
    }

    // 奇門排盤核心邏輯 (繼承自 Step 1-12)
    const STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
    const BRANCHES = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    const EARTH_STEM_ORDER = ['戊', '己', '庚', '辛', '壬', '癸', '丁', '丙', '乙'];
    const ORIGINAL_PALACE = {
        1: { star: '蓬', door: '休' }, 2: { star: '芮', door: '死' },
        3: { star: '沖', door: '傷' }, 4: { star: '輔', door: '杜' },
        6: { star: '心', door: '開' }, 7: { star: '柱', door: '惊' },
        8: { star: '任', door: '生' }, 9: { star: '英', door: '景' }
    };
    const CLOCKWISE_PALACES = [8, 3, 4, 9, 2, 7, 6, 1]; 
    const COUNTER_CLOCKWISE = [8, 1, 6, 7, 2, 9, 4, 3]; 
    const STARS_ORDER = ['任', '沖', '輔', '英', '芮', '柱', '心', '蓬']; 
    const DOORS_ORDER = ['休', '生', '傷', '杜', '景', '死', '惊', '開']; 
    const GODS_ORDER = ['符', '蛇', '陰', '合', '虎', '武', '九', '天']; 

    function calculate() {
        let juType = document.getElementById('juType').value;
        let juNumber = parseInt(document.getElementById('juNumber').value);
        let hGz = document.getElementById('manualHourGz').value || '己未';
        let tStem = hGz.charAt(0);
        let tBranch = hGz.charAt(1);

        // 找旬首
        let stemIdx = STEMS.indexOf(tStem);
        let branchIdx = BRANCHES.indexOf(tBranch);
        let diff = branchIdx - stemIdx;
        if (diff < 0) diff += 12;
        let xunShouStem = "", xunBranch = "";
        
        if (diff === 0) { xunShouStem = "戊"; xunBranch = "子"; }
        else if (diff === 10) { xunShouStem = "己"; xunBranch = "戌"; }
        else if (diff === 8) { xunShouStem = "庚"; xunBranch = "申"; }
        else if (diff === 6) { xunShouStem = "辛"; xunBranch = "午"; }
        else if (diff === 4) { xunShouStem = "壬"; xunBranch = "辰"; }
        else if (diff === 2) { xunShouStem = "癸"; xunBranch = "寅"; }

        // 排地盤
        let earthPan = {1:"", 2:"", 3:"", 4:"", 5:"", 6:"", 7:"", 8:"", 9:""};
        let currentPalace = juNumber;
        for (let i = 0; i < EARTH_STEM_ORDER.length; i++) {
            earthPan[currentPalace] = EARTH_STEM_ORDER[i];
            if (juType === '陽') currentPalace = currentPalace === 9 ? 1 : currentPalace + 1;
            else currentPalace = currentPalace === 1 ? 9 : currentPalace - 1;
        }
        let original5Stem = earthPan[5];
        earthPan[2] = earthPan[5]; // 簡化：寄宮直接取5宮干

        // 定值符值使
        let xunShouPalace = 0;
        for (let p = 1; p <= 9; p++) {
            if (earthPan[p].includes(xunShouStem)) xunShouPalace = p;
        }
        let targetPalace = xunShouPalace === 5 ? 2 : xunShouPalace;
        let zhiFu = ORIGINAL_PALACE[targetPalace].star;
        let zhiShi = ORIGINAL_PALACE[targetPalace].door;

        // 排九星
        let timeStemPalace = 0;
        for (let p = 1; p <= 9; p++) {
            if (earthPan[p].includes(tStem)) timeStemPalace = p;
        }
        if (timeStemPalace === 5) timeStemPalace = 2;
        let starsPan = {};
        let startPalaceIdx = CLOCKWISE_PALACES.indexOf(timeStemPalace);
        let startStarIdx = STARS_ORDER.indexOf(zhiFu);
        for (let i = 0; i < 8; i++) starsPan[CLOCKWISE_PALACES[(startPalaceIdx + i) % 8]] = STARS_ORDER[(startStarIdx + i) % 8];

        // 排天盤
        let heavenPan = {};
        let pengPalace = Object.keys(starsPan).find(key => starsPan[key] === '蓬');
        let pengIdx = CLOCKWISE_PALACES.indexOf(parseInt(pengPalace));
        let p1Idx = CLOCKWISE_PALACES.indexOf(1);
        for (let i = 0; i < 8; i++) heavenPan[CLOCKWISE_PALACES[(pengIdx + i) % 8]] = earthPan[CLOCKWISE_PALACES[(p1Idx + i) % 8]];

        // 排八門
        let doorsPan = {};
        let xunBranchNum = BRANCHES.indexOf(xunBranch) + 1;
        let timeBranchNum = BRANCHES.indexOf(tBranch) + 1;
        let steps = timeBranchNum - xunBranchNum;
        if (steps < 0) steps += 12;
        let zhiShiPalace = xunShouPalace;
        if (juType === '陽') zhiShiPalace = ((xunShouPalace - 1 + steps) % 9) + 1;
        else zhiShiPalace = ((xunShouPalace - 1 - steps % 9 + 9) % 9) + 1;
        if (zhiShiPalace === 5) zhiShiPalace = 2;
        let zhiShiStartIdx = CLOCKWISE_PALACES.indexOf(zhiShiPalace);
        let doorStartIdx = DOORS_ORDER.indexOf(zhiShi);
        for (let i = 0; i < 8; i++) doorsPan[CLOCKWISE_PALACES[(zhiShiStartIdx + i) % 8]] = DOORS_ORDER[(doorStartIdx + i) % 8];

        // 排八神
        let godsPan = {};
        let heavenXunPalace = Object.keys(heavenPan).find(key => heavenPan[key].includes(xunShouStem));
        let godStartIdx = juType === '陽' ? CLOCKWISE_PALACES.indexOf(parseInt(heavenXunPalace)) : COUNTER_CLOCKWISE.indexOf(parseInt(heavenXunPalace));
        for (let i = 0; i < 8; i++) {
            if (juType === '陽') godsPan[CLOCKWISE_PALACES[(godStartIdx + i) % 8]] = GODS_ORDER[i];
            else godsPan[COUNTER_CLOCKWISE[(godStartIdx + i) % 8]] = GODS_ORDER[i];
        }

        // 神煞 (馬, 空, 刑, 墓)
        let remarks = {1:{}, 2:{}, 3:{}, 4:{}, 6:{}, 7:{}, 8:{}, 9:{}};
        
        let diffKong = BRANCHES.indexOf(tBranch) - STEMS.indexOf(tStem);
        if (diffKong < 0) diffKong += 12;
        let kong1="", kong2="";
        if(diffKong===0) {kong1="戌"; kong2="亥";} // 子丑... 簡化對應宮位
        // 這裡為還原 UI，直接在特定宮位加上紅字標記
        // 馬星
        let maXingPalace = 0;
        if (['亥','卯','未'].includes(tBranch)) maXingPalace = 4;
        else if (['寅','午','戌'].includes(tBranch)) maXingPalace = 2;
        else if (['巳','酉','丑'].includes(tBranch)) maXingPalace = 6;
        else if (['申','子','辰'].includes(tBranch)) maXingPalace = 8;
        if(maXingPalace) remarks[maXingPalace].ma = true;

        // 渲染畫面
        document.getElementById('g5-data').innerHTML = `${juType} ${juNumber} 局<br>甲${xunBranch}${xunShouStem} 旬<br>${hGz} 時`;

        for (let i = 1; i <= 9; i++) {
            if (i === 5) continue;
            
            // 模仿圖片的排版佈局
            let leftCol = `
                <span>${godsPan[i]}</span>
                <span>${starsPan[i]}</span>
                <span>${doorsPan[i]}</span>
            `;
            let rightCol = `
                <span>${godsPan[i]}</span>
                <span>${heavenPan[i]}</span>
                <span>${earthPan[i]}</span>
            `;
            
            let html = leftCol + rightCol;
            document.getElementById(`g${i}-data`).innerHTML = html;
            
            // 處理浮動神煞 (左下馬星, 左上空亡等)
            let extraHTML = "";
            if(remarks[i].ma) extraHTML += `<div class="red-mark" style="left:8px; bottom:10px;">馬</div>`;
            document.getElementById(`g${i}-data`).innerHTML += extraHTML;
        }
    }
</script>
</body>
</html>
