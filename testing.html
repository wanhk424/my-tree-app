<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>無限層級樹狀清單</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的清單">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { max-width: 600px; margin: 0 auto; padding: 15px; background-color: #f4f6f8; color: #333; }
    h1 { text-align: center; font-size: 1.4rem; color: #2c3e50; margin: 10px 0 15px; }
    
    .card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
    .search-box { width: 100%; padding: 12px 15px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; }
    
    .add-root-form { display: flex; gap: 8px; }
    .add-root-form input { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid #cbd5e1; border-radius: 6px; }
    
    .backup-bar { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
    .backup-bar span { font-size: 13px; color: #64748b; font-weight: 600; }
    .backup-btn-group { display: flex; gap: 8px; }
    
    button { cursor: pointer; padding: 6px 12px; border: none; border-radius: 6px; background: #3498db; color: white; font-size: 13px; font-weight: 500; -webkit-tap-highlight-color: transparent; }
    button:active { opacity: 0.8; }
    button.success { background: #2ecc71; }
    button.danger { background: #e74c3c; }
    button.secondary { background: #8e44ad; }
    button.outline { background: #f8fafc; color: #475569; border: 1px solid #cbd5e1; }
    
    .tree-group { list-style: none; padding-left: 0; margin: 0; }
    .node-content .tree-group { padding-left: 10px; border-left: 2px solid #e2e8f0; margin-top: 6px; }
    
    .tree-node { margin-bottom: 6px; }
    .node-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    
    /* 點擊標題卡片區域即可 Toggle */
    .node-header { padding: 10px 12px; background: #fff; user-select: none; cursor: pointer; }
    .node-header:hover { background: #f8fafc; }
    .node-main-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    
    .node-title-group { display: flex; align-items: flex-start; gap: 6px; flex: 1; min-width: 0; }
    .toggle-btn { background: none; color: #64748b; font-size: 12px; padding: 2px 4px; border-radius: 4px; width: 20px; text-align: center; margin-top: 2px; transition: transform 0.2s; }
    
    /* 文字依據空格與 Enter 換行，正常接收點擊事件 */
    .node-title { 
      font-weight: 600; 
      font-size: 15px; 
      line-height: 1.5; 
      word-break: normal; 
      overflow-wrap: break-word; 
      white-space: pre-wrap; 
      flex: 1;
    }
    .badge { font-size: 11px; background: #f1f5f9; color: #64748b; padding: 2px 6px; border-radius: 10px; margin-top: 2px; flex-shrink: 0; }
    
    .node-actions { display: flex; gap: 4px; flex-shrink: 0; margin-top: 1px; }
    .node-actions button { padding: 4px 8px; font-size: 12px; }
    
    .node-content { display: none; padding: 6px; background: #fafafa; border-top: 1px dashed #e2e8f0; }
    
    /* 開啟狀態箭頭旋轉與展開內容 */
    .tree-node.open > .node-card > .node-header .toggle-btn { transform: rotate(90deg); color: #3498db; }
    .tree-node.open > .node-card > .node-content { display: block; }
    
    .hidden { display: none !important; }
    .empty-msg { text-align: center; color: #94a3b8; padding: 20px 0; font-size: 14px; }
  </style>
</head>
<body>

  <h1>無限層級樹狀清單</h1>

  <div class="card">
    <div class="backup-bar">
      <span>💾 資料安全備份</span>
      <div class="backup-btn-group">
        <button class="secondary" onclick="exportJSON()">匯出備份</button>
        <button class="outline" onclick="triggerImport()">匯入還原</button>
        <input type="file" id="importInput" accept=".json" style="display: none;" onchange="importJSON(event)">
      </div>
    </div>
  </div>

  <div class="card">
    <input type="text" id="searchInput" class="search-box" placeholder="搜尋關鍵字..." oninput="handleSearch()">
  </div>

  <div class="card">
    <div class="add-root-form">
      <input type="text" id="rootInput" placeholder="新增主分類 (例如: 工作)">
      <button class="success" onclick="addNode(null)">+ 新增</button>
    </div>
  </div>

  <div class="card">
    <ul id="treeContainer" class="tree-group"></ul>
  </div>

<script>
  const defaultData = [
    {
      id: '1', title: '工作', children: [
        {
          id: '1-1', title: '清潔', children: [
            { id: '1-1-1', title: '陳大文\n電話: 91234567\n備註: 負責 1 樓大堂清潔作業', children: [] }
          ]
        }
      ]
    }
  ];

  let treeData = JSON.parse(localStorage.getItem('myInfiniteTreeData')) || defaultData;

  function saveData() {
    localStorage.setItem('myInfiniteTreeData', JSON.stringify(treeData));
  }

  function renderTree() {
    const container = document.getElementById('treeContainer');
    container.innerHTML = '';
    if (treeData.length === 0) {
      container.innerHTML = '<div class="empty-msg">目前沒有資料，請新增主分類。</div>';
      return;
    }
    container.appendChild(createTreeDOM(treeData));
  }

  function createTreeDOM(nodes) {
    const ul = document.createElement('ul');
    ul.className = 'tree-group';

    nodes.forEach(node => {
      const li = document.createElement('li');
      li.className = 'tree-node';
      li.id = `node-${node.id}`;

      const hasChildren = node.children && node.children.length > 0;
      const childCount = hasChildren ? node.children.length : 0;

      li.innerHTML = `
        <div class="node-card">
          <div class="node-header" onclick="toggleNode(event, '${node.id}')">
            <div class="node-main-row">
              <div class="node-title-group">
                <span class="toggle-btn">${hasChildren ? '▶' : '•'}</span>
                <div class="node-title">${escapeHtml(node.title)}</div>
                ${hasChildren ? `<span class="badge">${childCount}</span>` : ''}
              </div>
              <div class="node-actions" onclick="event.stopPropagation()">
                <button class="success" onclick="addNode('${node.id}')">+子層</button>
                <button onclick="editNode('${node.id}')">改</button>
                <button class="danger" onclick="deleteNode('${node.id}')">刪</button>
              </div>
            </div>
          </div>
          <div class="node-content" id="content-${node.id}"></div>
        </div>
      `;

      if (hasChildren) {
        const contentDiv = li.querySelector(`#content-${node.id}`);
        contentDiv.appendChild(createTreeDOM(node.children));
      }

      ul.appendChild(li);
    });

    return ul;
  }

  // 點擊任何標題位置觸發 Toggle
  function toggleNode(event, id) {
    event.stopPropagation();
    const li = document.getElementById(`node-${id}`);
    if (li) {
      li.classList.toggle('open');
    }
  }

  function setNodeAndChildrenOpenState(nodes, isOpen) {
    nodes.forEach(node => {
      const li = document.getElementById(`node-${node.id}`);
      if (li) {
        if (isOpen) li.classList.add('open');
        else li.classList.remove('open');
      }
      if (node.children && node.children.length > 0) {
        setNodeAndChildrenOpenState(node.children, isOpen);
      }
    });
  }

  function handleSearch() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();

    function filterNodes(nodes, isParentMatched = false) {
      let anyMatch = false;

      nodes.forEach(node => {
        const li = document.getElementById(`node-${node.id}`);
        const titleMatch = node.title.toLowerCase().includes(query);
        const selfOrParentMatch = isParentMatched || (query !== '' && titleMatch);
        let childMatch = false;

        if (node.children && node.children.length > 0) {
          childMatch = filterNodes(node.children, selfOrParentMatch);
        }

        if (query === '') {
          li.classList.remove('hidden', 'open');
        } else if (titleMatch || childMatch || isParentMatched) {
          li.classList.remove('hidden');
          li.classList.add('open');

          if (titleMatch && node.children && node.children.length > 0) {
            setNodeAndChildrenOpenState(node.children, true);
          }

          anyMatch = true;
        } else {
          li.classList.add('hidden');
        }
      });

      return anyMatch;
    }

    filterNodes(treeData);
  }

  function findNodeAndParent(nodes, id, parent = null) {
    for (let node of nodes) {
      if (node.id === id) return { node, parent };
      if (node.children) {
        const res = findNodeAndParent(node.children, id, node);
        if (res.node) return res;
      }
    }
    return { node: null, parent: null };
  }

  function addNode(parentId) {
    let title = '';
    if (!parentId) {
      const input = document.getElementById('rootInput');
      title = input.value.trim();
      input.value = '';
    } else {
      title = prompt('請輸入新項目/子層內容：');
    }

    if (!title) return;

    const newNode = { id: 'node_' + Date.now(), title: title.trim(), children: [] };

    if (!parentId) {
      treeData.push(newNode);
    } else {
      const { node } = findNodeAndParent(treeData, parentId);
      if (node) {
        node.children.push(newNode);
      }
    }

    saveData();
    renderTree();

    if (parentId) {
      const parentLi = document.getElementById(`node-${parentId}`);
      if (parentLi) parentLi.classList.add('open');
    }
  }

  function editNode(id) {
    const { node } = findNodeAndParent(treeData, id);
    if (!node) return;

    const newTitle = prompt('修改內容：', node.title);
    if (newTitle !== null && newTitle.trim() !== '') {
      node.title = newTitle.trim();
      saveData();
      renderTree();
    }
  }

  function deleteNode(id) {
    if (!confirm('確定刪除此項目（連同其所有子項目）？')) return;

    const { node, parent } = findNodeAndParent(treeData, id);
    if (parent) {
      parent.children = parent.children.filter(child => child.id !== id);
    } else {
      treeData = treeData.filter(item => item.id !== id);
    }

    saveData();
    renderTree();
  }

  function exportJSON() {
    const dataStr = JSON.stringify(treeData, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    const now = new Date();
    const dateStr = now.toISOString().slice(0, 10);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = `tree_backup_${dateStr}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function triggerImport() {
    document.getElementById('importInput').click();
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (Array.isArray(importedData)) {
          if (confirm('匯入備份將會覆蓋當前所有資料，確定要還原嗎？')) {
            treeData = importedData;
            saveData();
            renderTree();
            alert('資料已成功還原！');
          }
        } else {
          alert('匯入失敗：備份檔案格式不正確！');
        }
      } catch (err) {
        alert('解析 JSON 檔案時發生錯誤！');
      }
      event.target.value = '';
    };

    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  renderTree();
</script>
</body>
</html>
